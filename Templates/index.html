<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KNN Diabetes Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 600px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1565c0;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 20px;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🩺 KNN Diabetes Prediction</h1>

        <p class="subtitle">
            Enter the patient's information
        </p>

        <form action="/predict" method="POST">

            <div class="form-group">
                <label>Pregnancies</label>
                <input type="number" name="pregnancies" min="0" required>
            </div>

            <div class="form-group">
                <label>Glucose</label>
                <input type="number" name="glucose" step="any" required>
            </div>

            <div class="form-group">
                <label>Blood Pressure</label>
                <input type="number" name="blood_pressure" step="any" required>
            </div>

            <div class="form-group">
                <label>Skin Thickness</label>
                <input type="number" name="skin_thickness" step="any" required>
            </div>

            <div class="form-group">
                <label>Insulin</label>
                <input type="number" name="insulin" step="any" required>
            </div>

            <div class="form-group">
                <label>BMI</label>
                <input type="number" name="bmi" step="any" required>
            </div>

            <div class="form-group">
                <label>Diabetes Pedigree Function</label>
                <input type="number" name="diabetes_pedigree" step="any" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" min="1" required>
            </div>

            <button type="submit">
                Predict Diabetes
            </button>

        </form>

        {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
        {% endif %}

        <p class="note">
            This application is for educational purposes only.
        </p>

    </div>

</body>

</html>
